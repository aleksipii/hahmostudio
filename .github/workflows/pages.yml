name: Validate private Hahmostudio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:private
      - uses: actions/upload-artifact@v4
        with:
          name: hahmostudio-private-build
          path: dist
          retention-days: 7
  speech-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/build-rhubarb-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: hahmostudio-speech-macos-arm64
          path: .private-runtime/rhubarb
          include-hidden-files: true
          retention-days: 7
