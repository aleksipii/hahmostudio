[workspace]
resolver = "2"
members = [
    "crates/hs-subtitle",
    "crates/hs-edit",
    "crates/hs-image",
    "crates/hs-project",
    "crates/hs-core",
    "crates/hs-script",
    "crates/hs-motion",
    "crates/hs-character",
    "crates/hs-render",
    "crates/hs-lipsync",
    "crates/hs-voice",
    "crates/hs-audio",
    "crates/hs-camera",
    "crates/hs-hahmo",
    "crates/hs-agents",
    "crates/hs-cli",
    "crates/hs-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
hs-subtitle = { path = "crates/hs-subtitle" }
hs-edit = { path = "crates/hs-edit" }
hs-image = { path = "crates/hs-image" }
hs-project = { path = "crates/hs-project" }
hs-core = { path = "crates/hs-core" }
hs-script = { path = "crates/hs-script" }
hs-motion = { path = "crates/hs-motion" }
hs-character = { path = "crates/hs-character" }
hs-render = { path = "crates/hs-render", default-features = false }
hs-hahmo = { path = "crates/hs-hahmo" }
hs-agents = { path = "crates/hs-agents" }
hs-voice = { path = "crates/hs-voice", default-features = false }
hs-lipsync = { path = "crates/hs-lipsync" }
hs-audio = { path = "crates/hs-audio" }
hs-camera = { path = "crates/hs-camera" }
glam = { version = "0.29", features = ["serde", "bytemuck"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
bytemuck = { version = "1", features = ["derive"] }
png = "0.17"
tiny-skia = "0.11"
zip = { version = "2", default-features = false, features = ["deflate"] }
wgpu = "24"
pollster = "0.4"
eframe = { version = "0.31", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland", "persistence"] }
egui-wgpu = "0.31"
rfd = "0.15"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
