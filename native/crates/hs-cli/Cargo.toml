[package]
name = "hs-cli"
description = "Hahmostudion komentorivi: headless-renderöinti, tarkistus ja suorituskykymittaus"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "hahmostudio-cli"
path = "src/main.rs"

[dependencies]
hs-project.workspace = true
