[package]
name = "hs-app"
description = "Hahmostudio natiivina työpöytäsovelluksena (egui/eframe + wgpu)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "hahmostudio"
path = "src/main.rs"

[dependencies]
hs-image.workspace = true
hs-edit.workspace = true
hs-subtitle.workspace = true
hs-project.workspace = true
hs-core.workspace = true
hs-motion.workspace = true
hs-script.workspace = true
hs-character.workspace = true
hs-render.workspace = true
hs-hahmo.workspace = true
hs-agents.workspace = true
eframe = { workspace = true, features = ["accesskit"] }
egui-wgpu.workspace = true
wgpu.workspace = true
serde.workspace = true
serde_json.workspace = true
rfd.workspace = true
hs-voice = { workspace = true, features = ["kokoro", "download"] }
hs-audio.workspace = true
hs-lipsync.workspace = true
hs-camera.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSObject", "NSString", "NSURL"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder"] }
