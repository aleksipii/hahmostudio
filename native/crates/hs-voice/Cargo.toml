[package]
name = "hs-voice"
description = "Hahmostudio: offline-puhe (Kokoro-82M candlella), WAV ja visemi-huulisynkka"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["kokoro", "download"]
# Kokoro-82M puhtaalla Rustilla: candle-päättely + loqui-g2p (misaki-sanastot, ei eSpeakia).
kokoro = ["dep:candle-core", "dep:candle-nn", "dep:omp-voice-kokoro", "dep:loqui-g2p"]
# Mallin lataus käyttäjän luvalla (rustls). Ilman tätä malli kopioidaan kansioon käsin.
download = ["dep:ureq"]

[dependencies]
serde.workspace = true
hs-lipsync.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2 = "0.10"
candle-core = { version = "0.11", optional = true }
candle-nn = { version = "0.11", optional = true }
omp-voice-kokoro = { version = "0.1", optional = true }
loqui-g2p = { version = "0.3", optional = true }
ureq = { version = "3", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.11", optional = true, features = ["metal"] }
candle-nn = { version = "0.11", optional = true, features = ["metal"] }
